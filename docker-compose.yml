version: '3.8'

services:
  app:
    build:
      context: .
      args:
        BASE_URL: ${BASE_URL:-/}
    container_name: skillhub
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3030
      - BASE_URL=${BASE_URL:-/}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=skillhub
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-skillhub_password}
      - MYSQL_DATABASE=skillhub
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_BASE_URL=${AI_API_BASE_URL:-https://api.openai.com/v1}
      - AI_MODEL=${AI_MODEL:-gpt-4o}
    volumes:
      - ./skills:/app/skills
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mysql:8.0
    container_name: skillhub-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=skillhub
      - MYSQL_USER=skillhub
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-skillhub_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
